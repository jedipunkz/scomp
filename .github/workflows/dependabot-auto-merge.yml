name: Dependabot auto-merge

on: pull_request_target

permissions: {}

jobs:
  auto-merge:
    # github.event.pull_request.user.login is required: github.actor is
    # spoofable on pull_request_target events.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for patch and minor updates
        # Major updates contain breaking changes and are merged manually.
        if: |
          contains(steps.metadata.outputs.update_type, 'version-update:semver-patch') ||
          contains(steps.metadata.outputs.update_type, 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
